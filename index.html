<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delta Force Top14</title>
  <style>
    :root { color-scheme: light; --ink:#1e2329; --muted:#65707f; --line:#d8dee8; --panel:#f7f9fc; --brand:#0f766e; --hot:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif; color:var(--ink); background:#ffffff; }
    header { border-bottom:1px solid var(--line); background:#f3f6f8; }
    .wrap { max-width:1280px; margin:0 auto; padding:20px; }
    .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
    h1 { margin:0 0 8px; font-size:28px; line-height:1.15; letter-spacing:0; }
    .sub { margin:0; color:var(--muted); line-height:1.45; max-width:820px; }
    select { min-width:180px; height:38px; border:1px solid var(--line); border-radius:6px; background:white; padding:0 10px; font-size:14px; }
    main { display:grid; grid-template-columns: 390px minmax(0, 1fr); min-height:calc(100vh - 118px); }
    .list { border-right:1px solid var(--line); overflow:auto; max-height:calc(100vh - 118px); background:#fbfcfd; }
    .item { width:100%; display:grid; grid-template-columns:56px 72px minmax(0,1fr); gap:10px; padding:12px 14px; border:0; border-bottom:1px solid var(--line); background:transparent; text-align:left; cursor:pointer; color:inherit; }
    .item.active { background:#e9f7f5; box-shadow: inset 4px 0 0 var(--brand); }
    .rank { font-weight:700; font-size:18px; color:var(--brand); }
    .thumb { width:72px; aspect-ratio: 16/10; object-fit:cover; background:#dde5ed; border-radius:6px; }
    .meta { min-width:0; }
    .title { font-size:14px; line-height:1.35; font-weight:700; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .small { margin-top:6px; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .detail { padding:20px; overflow:auto; max-height:calc(100vh - 118px); }
    .player { position:relative; width:100%; aspect-ratio:16/9; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:#111; }
    .notice { margin-top:8px; border:1px solid #f3c267; background:#fff8e6; color:#5f3b00; border-radius:6px; padding:9px 11px; font-size:13px; line-height:1.45; }
    .transcript { max-height:190px; overflow:auto; white-space:pre-wrap; font-size:13px; line-height:1.55; color:#303846; }
    iframe { width:100%; height:100%; border:0; display:block; }
    #player { width:100%; height:100%; }
    .subtitleOverlay { position:absolute; left:5%; right:5%; bottom:54px; display:flex; justify-content:center; pointer-events:none; z-index:3; }
    .subtitleText { max-width:94%; padding:7px 12px; border-radius:6px; background:rgba(0,0,0,.76); color:#fff; font-size:18px; line-height:1.35; text-align:center; text-shadow:0 1px 2px #000; white-space:pre-wrap; }
    .subtitleText:empty { display:none; }
    .detail-grid { display:grid; grid-template-columns: 1fr 300px; gap:18px; margin-top:16px; align-items:start; }
    h2 { font-size:22px; line-height:1.28; margin:0 0 12px; letter-spacing:0; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0; }
    .stat { border:1px solid var(--line); border-radius:6px; padding:10px; background:var(--panel); }
    .stat b { display:block; font-size:17px; }
    .stat span { font-size:12px; color:var(--muted); }
    .box { border:1px solid var(--line); border-radius:6px; padding:14px; margin-top:12px; background:#fff; }
    .box h3 { margin:0 0 8px; font-size:15px; }
    .box p { margin:0; color:#303846; line-height:1.55; }
    .insight-list { margin:0; padding-left:18px; color:#263241; line-height:1.55; }
    .insight-list li { margin:0 0 7px; }
    .tagRow { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 6px; }
    .tag { display:inline-flex; align-items:center; min-height:28px; border:1px solid #badbd6; background:#ecf8f6; color:#0b625b; border-radius:999px; padding:4px 10px; font-size:13px; font-weight:700; }
    .caption-status { color:#5f3b00; border-color:#f3c267; background:#fff8e6; }
    .links { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .links a { color:#075985; text-decoration:none; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:13px; background:white; }
    .sourceSwitch { display:none; }
    .sourceSwitch button { border:1px solid var(--line); background:white; color:#253040; border-radius:6px; padding:8px 10px; font-size:13px; cursor:pointer; }
    .sourceSwitch button.active { background:#0f766e; color:white; border-color:#0f766e; }
    .side { border-left:1px solid var(--line); padding-left:18px; }
    .caption-list { margin:0; padding-left:18px; color:#303846; line-height:1.6; }
    @media (max-width: 900px) {
      .topbar { flex-direction:column; }
      main { grid-template-columns:1fr; }
      .list { max-height:42vh; border-right:0; border-bottom:1px solid var(--line); }
      .detail { max-height:none; }
      .detail-grid { grid-template-columns:1fr; }
      .side { border-left:0; padding-left:0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <div>
        <h1 id="pageTitle"></h1>
        <p class="sub" id="pageSubtitle"></p>
      </div>
      <select id="lang"></select>
    </div>
  </header>
  <main>
    <nav class="list" id="list"></nav>
    <section class="detail">
      <div class="sourceSwitch" id="sourceSwitch"></div>
      <div class="player"><div id="player"></div><div class="subtitleOverlay"><div class="subtitleText" id="subtitleText"></div></div></div>
      <div class="notice" id="driveNotice"></div>
      <div class="detail-grid">
        <div>
          <h2 id="videoTitle"></h2>
          <div class="small" id="videoMeta"></div>
          <div class="stats" id="stats"></div>
          <div class="box">
            <h3 id="summaryLabel"></h3>
            <ul class="insight-list" id="insightList"></ul>
          </div>
          <div class="box">
            <h3 id="asrLabel"></h3>
            <p class="transcript" id="transcriptPreview"></p>
          </div>
          <div class="links" id="links"></div>
        </div>
        <aside class="side">
          <div class="box">
            <h3 id="tagLabel"></h3>
            <div class="tagRow" id="tagChips"></div>
          </div>
          <div class="box caption-status">
            <h3 id="captionStatusLabel"></h3>
            <p id="uploadStatus"></p>
            <p id="captionStatus" style="margin-top:8px;"></p>
          </div>
        </aside>
      </div>
    </section>
  </main>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const state = { data: null, lang: localStorage.getItem("lang") || "zh", index: 0, playerMode: "youtube", captions: [], captionUrl: "", youtubeReady: false };
    let ytPlayer = null;
    let pendingVideoId = null;
    const fmt = new Intl.NumberFormat("zh-Hant");
    const $ = (id) => document.getElementById(id);
    function heat(v){ return (v.digg_count||0) + (v.comment_count||0)*3 + (v.share_count||0)*4 + (v.collect_count||0)*2; }
    function t(key){ return state.data.ui[state.lang][key] || state.data.ui.zh[key]; }
    function copy(v){ return v.copy[state.lang] || v.copy.zh; }
    function renderLang(){
      $("lang").innerHTML = Object.entries(state.data.languages).map(([code, label]) => `<option value="${code}">${label}</option>`).join("");
      $("lang").value = state.lang;
      $("pageTitle").textContent = t("title");
      $("pageSubtitle").textContent = t("subtitle");
      renderList(); renderDetail();
    }
    function renderList(){
      $("list").innerHTML = state.data.videos.map((v, i) => {
        const c = copy(v);
        return `<button class="item ${i===state.index?'active':''}" onclick="selectVideo(${i})">
          <div class="rank">#${v.rank}</div>
          <img class="thumb" src="${v.cover_site_path || ''}" alt="">
          <div class="meta"><div class="title">${c.title}</div><div class="small">${v.author_name || ''} · ${fmt.format(v.digg_count||0)} likes</div></div>
        </button>`;
      }).join("");
    }
    function availableSources(v){
      return [{key:"youtube", label:"YouTube", url:v.youtube_embed_url || ""}];
    }
    function selectSource(mode){ state.playerMode = mode; renderDetail(); }

    window.onYouTubeIframeAPIReady = () => {
      state.youtubeReady = true;
      if (pendingVideoId) loadYouTubeVideo(pendingVideoId);
    };
    function loadYouTubeVideo(videoId){
      if (!videoId) return;
      pendingVideoId = videoId;
      if (!state.youtubeReady || !window.YT || !window.YT.Player) return;
      if (!ytPlayer) {
        ytPlayer = new YT.Player("player", {
          videoId,
          playerVars: { rel: 0, modestbranding: 1, playsinline: 1, cc_load_policy: 0 },
          events: { onReady: () => updateSubtitle() }
        });
      } else if (ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(videoId);
      }
    }
    function captionLang(){ return state.lang === "zh" ? "zh-Hans" : state.lang; }
    function parseTimecode(raw){
      const m = raw.trim().match(/(\d+):(\d+):(\d+)[,.](\d+)/);
      if (!m) return 0;
      return Number(m[1])*3600 + Number(m[2])*60 + Number(m[3]) + Number((m[4]+"000").slice(0,3))/1000;
    }
    function parseSrt(text){
      return text.replace(/\r/g, "").split(/\n\s*\n/).map(block => {
        const lines = block.split("\n").filter(Boolean);
        const timeLine = lines.find(line => line.includes("-->"));
        if (!timeLine) return null;
        const [start, end] = timeLine.split("-->").map(x => x.trim());
        const idx = lines.indexOf(timeLine);
        return { start: parseTimecode(start), end: parseTimecode(end), text: lines.slice(idx + 1).join("\n").trim() };
      }).filter(Boolean);
    }
    async function loadCaptions(v){
      const url = `captions_full/${captionLang()}/${v.video_id}.srt`;
      state.captionUrl = url;
      state.captions = [];
      $("subtitleText").textContent = "";
      try {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error(String(response.status));
        if (state.captionUrl !== url) return;
        state.captions = parseSrt(await response.text());
      } catch (error) {
        state.captions = [];
      }
    }
    function updateSubtitle(){
      if (!ytPlayer || !ytPlayer.getCurrentTime || !state.captions.length) {
        if ($("subtitleText")) $("subtitleText").textContent = "";
        return;
      }
      let current = 0;
      try { current = ytPlayer.getCurrentTime(); } catch (e) { return; }
      const cue = state.captions.find(item => current >= item.start && current < item.end);
      $("subtitleText").textContent = cue ? cue.text : "";
    }
    setInterval(updateSubtitle, 250);

    function renderDetail(){
      const v = state.data.videos[state.index], c = copy(v);
      const sources = availableSources(v);
      const active = sources.find(s => s.key === state.playerMode && s.url) || sources[0];
      state.playerMode = active.key;
      $("sourceSwitch").innerHTML = "";
      loadYouTubeVideo(v.youtube_video_id);
      loadCaptions(v);
      $("driveNotice").textContent = "YouTube-only playback with site-managed subtitles. Changing the page language also changes the synced subtitle overlay; this does not depend on YouTube caption upload quota.";
      $("videoTitle").textContent = c.title;
      $("videoMeta").textContent = `${t("rank")} #${v.rank} · ${t("creator")} ${v.author_name || ""} · ${t("published")} ${v.create_time_text || ""}`;
      $("stats").innerHTML = [
        ["Likes", v.digg_count], ["Comments", v.comment_count], ["Shares", v.share_count], [t("engagement"), heat(v)]
      ].map(([label, val]) => `<div class="stat"><b>${fmt.format(val||0)}</b><span>${label}</span></div>`).join("");
      const primaryLabel = (v.content_type_translations && (v.content_type_translations[state.lang] || v.content_type_translations.zh)) || v.primary_tag || c.category;
      $("summaryLabel").textContent = `${t("caption")} · ${primaryLabel}`;
      $("insightList").innerHTML = (v.insight_bullets && (v.insight_bullets[state.lang] || v.insight_bullets.zh) || c.cues || []).map(x => `<li>${x}</li>`).join("");
      $("tagLabel").textContent = t("tags") || "Video Tags";
      const tags = (v.tag_translations && (v.tag_translations[state.lang] || v.tag_translations.zh)) || v.video_type_tags || [v.primary_tag || c.category];
      $("tagChips").innerHTML = tags.map(x => `<span class="tag">${x}</span>`).join("");
      $("captionStatusLabel").textContent = t("caption_status") || "YouTube Caption Status";
      $("uploadStatus").textContent = `${t("upload_status") || "YouTube Upload Status"}: ${v.youtube_upload_status || (v.youtube_video_id ? "Uploaded" : "Pending")}`;
      $("captionStatus").textContent = v.youtube_caption_status || (v.youtube_video_id ? "SRT is ready locally, but YouTube caption permission is not authorized yet." : "Waiting for YouTube upload.");
      $("asrLabel").textContent = t("asr") || "ASR Transcript";
      $("transcriptPreview").textContent = (v.asr && v.asr.transcript_preview) ? v.asr.transcript_preview : "ASR transcript not available.";
      const captionLang = state.lang === "zh" ? "zh-Hans" : state.lang;
      const localCaption = `captions_full/${captionLang}/${v.video_id}.srt`;
      const yt = v.youtube_watch_url || (v.youtube_video_id ? `https://youtu.be/${v.youtube_video_id}` : "#");
      $("links").innerHTML = `<a href="${yt}" target="_blank">YouTube</a><a href="${localCaption}" target="_blank">Segmented SRT</a>`;
    }
    window.selectSource = selectSource;
    window.selectVideo = (i) => { state.index = i; renderList(); renderDetail(); };
    $("lang").addEventListener("change", e => { state.lang = e.target.value; localStorage.setItem("lang", state.lang); renderLang(); });
    fetch("data/videos.json").then(r => r.json()).then(data => { state.data = data; renderLang(); });
  </script>
</body>
</html>
