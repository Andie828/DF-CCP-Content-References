<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delta Force Fortune Run Content Reference Library</title>
  <style>
    :root { color-scheme: light; --ink:#1d2430; --muted:#617082; --line:#d6ddea; --panel:#f5f8fb; --brand:#0f766e; --brand-soft:#e8f7f4; --warn:#fff6df; --warn-line:#e7c15e; --bg:#fbfcfe; --danger:#9f1239; --danger-soft:#fff1f2; --danger-line:#f6b6c7; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif; background:linear-gradient(180deg,#eef5f6 0,#ffffff 180px); color:var(--ink); }
    header { border-bottom:1px solid var(--line); background:rgba(255,255,255,.94); backdrop-filter: blur(8px); position:sticky; top:0; z-index:20; }
    .wrap { max-width:1320px; margin:0 auto; padding:18px 20px; }
    .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
    h1 { margin:0 0 8px; font-size:30px; line-height:1.1; }
    .alertBanner { margin:0 0 12px; padding:12px 14px; border:1px solid var(--danger-line); border-radius:14px; background:var(--danger-soft); color:var(--danger); font-size:18px; font-weight:800; line-height:1.45; }
    .sub { margin:0; color:var(--muted); line-height:1.7; max-width:920px; font-size:14px; }
    select { min-width:180px; height:40px; border:1px solid var(--line); border-radius:10px; background:white; padding:0 12px; font-size:14px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .toolbarRight { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .filterBar { display:flex; gap:8px; flex-wrap:wrap; }
    .filterBtn, .ghostBtn, .primaryBtn { border:1px solid var(--line); background:white; border-radius:999px; padding:8px 14px; font-size:14px; font-weight:700; color:#244052; cursor:pointer; }
    .filterBtn.active { background:var(--brand); color:white; border-color:var(--brand); }
    .ghostBtn:hover, .primaryBtn:hover, .filterBtn:hover { background:#f6fafb; }
    .primaryBtn { background:var(--brand); color:white; border-color:var(--brand); }
    .primaryBtn:hover { background:#0d655f; }
    .ghostBtn:disabled, .primaryBtn:disabled { opacity:.5; cursor:not-allowed; }
    .summaryPill { border:1px solid var(--line); border-radius:999px; background:white; padding:8px 12px; font-size:13px; color:#294154; }
    main { display:grid; grid-template-columns:410px minmax(0,1fr); min-height:calc(100vh - 185px); }
    .list { border-right:1px solid var(--line); background:rgba(255,255,255,.72); overflow:auto; max-height:calc(100vh - 185px); }
    .item { width:100%; display:grid; grid-template-columns:28px 52px 88px minmax(0,1fr); gap:10px; border:0; border-bottom:1px solid var(--line); background:transparent; text-align:left; padding:12px 14px; cursor:pointer; color:inherit; }
    .item:hover { background:#f6fafb; }
    .item.active { background:var(--brand-soft); box-shadow: inset 4px 0 0 var(--brand); }
    .checkWrap { display:flex; align-items:flex-start; justify-content:center; padding-top:3px; }
    .pickBox { width:18px; height:18px; accent-color:var(--brand); cursor:pointer; }
    .rank { font-size:18px; font-weight:800; color:var(--brand); }
    .thumb { width:88px; aspect-ratio:16/10; border-radius:10px; object-fit:cover; background:#dce5ef; }
    .meta { min-width:0; }
    .title { font-size:14px; line-height:1.35; font-weight:700; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .small { margin-top:6px; color:var(--muted); font-size:12px; line-height:1.35; }
    .badges { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
    .badge { display:inline-flex; align-items:center; border-radius:999px; padding:3px 8px; font-size:11px; font-weight:700; }
    .badge.cat { background:#ecf8f6; color:#0c675f; border:1px solid #bfdfd9; }
    .badge.play { background:#eef6ff; color:#24518a; border:1px solid #c6daf5; }
    .badge.wait { background:#fff6df; color:#7d5200; border:1px solid #e7c15e; }
    .badge.selected { background:#fff7e7; color:#8b5a00; border:1px solid #f0c676; }
    .detail { padding:20px; overflow:auto; max-height:calc(100vh - 185px); }
    .playerWrap { border:1px solid var(--line); border-radius:16px; overflow:hidden; background:#0d1117; }
    .playerHead { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 12px; background:#111927; color:#dbe8ff; }
    .sourceTabs { display:flex; gap:8px; flex-wrap:wrap; }
    .sourceTab { border:1px solid rgba(255,255,255,.18); background:transparent; color:#dbe8ff; border-radius:999px; padding:6px 10px; font-size:12px; cursor:pointer; }
    .sourceTab.active { background:#1f9d8f; border-color:#1f9d8f; color:white; }
    .player { position:relative; width:100%; aspect-ratio:16/9; background:#0b0f14; }
    iframe { width:100%; height:100%; border:0; display:block; }
    #ytPlayer { width:100%; height:100%; }
    .placeholder { display:flex; height:100%; align-items:center; justify-content:center; padding:24px; color:#dbe3ee; text-align:center; line-height:1.6; }
    .subtitleOverlay { position:absolute; left:6%; right:6%; bottom:56px; display:flex; justify-content:center; pointer-events:none; z-index:4; }
    .subtitleText { max-width:92%; padding:8px 12px; border-radius:10px; background:rgba(0,0,0,.75); color:#fff; font-size:18px; line-height:1.35; text-align:center; text-shadow:0 1px 2px #000; white-space:pre-wrap; }
    .subtitleText:empty { display:none; }
    .notice { margin-top:10px; border:1px solid var(--warn-line); background:var(--warn); color:#6b4700; border-radius:12px; padding:10px 12px; font-size:13px; line-height:1.5; }
    .detailGrid { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:18px; margin-top:16px; align-items:start; }
    h2 { margin:0 0 10px; font-size:24px; line-height:1.24; }
    .metaLine { color:var(--muted); font-size:13px; line-height:1.5; }
    .briefActions { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 0; }
    .stats { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin:14px 0; }
    .stat { border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:10px; }
    .stat b { display:block; font-size:16px; }
    .stat span { font-size:12px; color:var(--muted); }
    .box { border:1px solid var(--line); border-radius:14px; background:white; padding:14px; margin-top:12px; }
    .box h3 { margin:0 0 8px; font-size:15px; }
    .transcript { max-height:220px; overflow:auto; white-space:pre-wrap; font-size:13px; line-height:1.75; color:#334155; }
    .briefPreview { max-height:none; min-height:360px; background:#f8fbfd; border:1px dashed #cfe0ea; border-radius:12px; padding:18px 18px 20px; font-size:14px; line-height:1.9; letter-spacing:.01em; }
    .tagRow { display:flex; flex-wrap:wrap; gap:8px; }
    .tag { display:inline-flex; align-items:center; min-height:28px; border:1px solid #badbd6; background:#ecf8f6; color:#0b625b; border-radius:999px; padding:4px 10px; font-size:13px; font-weight:700; }
    .links { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .links a { color:#0b5cab; text-decoration:none; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13px; background:white; }
    .side { display:flex; flex-direction:column; gap:12px; }
    .statusText { color:#374151; line-height:1.6; font-size:13px; }
    @media (max-width: 980px) {
      .topbar { flex-direction:column; }
      main { grid-template-columns:1fr; min-height:auto; }
      .list { max-height:42vh; border-right:0; border-bottom:1px solid var(--line); }
      .detail { max-height:none; }
      .detailGrid { grid-template-columns:1fr; }
      .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .item { grid-template-columns:28px 44px 88px minmax(0,1fr); }
      .alertBanner { font-size:16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <div>
        <h1 id="pageTitle"></h1>
        <p class="alertBanner">⚠請勿直接分享本網站或 YouTube link 給創作者，會有創作權疑慮！</p>
        <p class="sub" id="pageSubtitle"></p>
      </div>
      <select id="lang"></select>
    </div>
    <div class="wrap toolbar">
      <div class="filterBar" id="campaignFilters"></div>
      <div class="toolbarRight">
        <div class="summaryPill" id="headerSummary"></div>
        <button class="ghostBtn" id="clearSelectionBtn"></button>
        <button class="primaryBtn" id="exportSelectedBtn"></button>
      </div>
    </div>
  </header>
  <main>
    <nav class="list" id="list"></nav>
    <section class="detail">
      <div class="playerWrap">
        <div class="playerHead">
          <div id="playerStatus"></div>
          <div class="sourceTabs" id="sourceTabs"></div>
        </div>
        <div class="player" id="playerShell">
          <div id="ytPlayer"></div>
          <div class="subtitleOverlay"><div class="subtitleText" id="subtitleText"></div></div>
        </div>
      </div>
      <div class="notice" id="playbackNotice"></div>
      <div class="detailGrid">
        <div>
          <h2 id="videoTitle"></h2>
          <div class="metaLine" id="videoMeta"></div>
          <div class="briefActions">
            <button class="ghostBtn" id="toggleBriefBtn"></button>
            <button class="primaryBtn" id="copyBriefBtn"></button>
          </div>
          <div class="stats" id="stats"></div>
          <div class="box">
            <h3 id="briefLabel"></h3>
            <div class="transcript briefPreview" id="briefPreview"></div>
          </div>
          <div class="box">
            <h3 id="transcriptLabel"></h3>
            <div class="transcript" id="transcriptPreview"></div>
          </div>
          <div class="links" id="links"></div>
        </div>
        <aside class="side">
          <div class="box">
            <h3 id="tagLabel"></h3>
            <div class="tagRow" id="tagChips"></div>
          </div>
          <div class="box">
            <h3 id="statusLabel"></h3>
            <div class="statusText" id="statusText"></div>
          </div>
        </aside>
      </div>
    </section>
  </main>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
